{% extends 'base.html' %}
{% load static %}
{% block head %}
<title>Forgot Password - Email Scraper & Verifier</title>
<meta name="description" content="Reset your Email Scraper & Verifier password">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    .forgot-dashboard {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        min-height: 84.5vh;
        padding: 2rem 0;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .forgot-dashboard::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: 
            radial-gradient(circle at 25% 25%, rgba(13, 148, 136, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 75% 75%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
        pointer-events: none;
    }
    .forgot-dashboard::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23cbd5e1' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
        pointer-events: none;
        opacity: 0.4;
    }
    .forgot-container {
        position: relative;
        z-index: 2;
        max-width: 500px;
        width: 100%;
        margin: 0 auto;
        padding: 0 1rem;
    }
    .forgot-card {
        background: rgba(255,255,255,0.97);
        backdrop-filter: blur(18px);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        border: 2px solid rgba(255,255,255,0.3);
        box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
        transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        animation: fadeInUp 0.7s ease forwards;
    }
    .forgot-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: linear-gradient(135deg, #0d9488, #14b8a6, #06b6d4);
        opacity: 1;
    }
    .forgot-card h1 {
        font-size: 2.2rem;
        font-weight: 700;
        color: #1e293b;
        text-align: center;
        margin-bottom: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
    }
    .forgot-card h1 i {
        color: #0d9488;
        font-size: 2rem;
    }
    .forgot-card p {
        color: #64748b;
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 1.08rem;
    }
    .forgot-form .form-group {
        margin-bottom: 1.3rem;
    }
    .forgot-label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
        font-size: 0.97rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .forgot-label i {
        color: #0d9488;
        width: 16px;
    }
    .forgot-input {
        width: 100%;
        padding: 1rem 1.25rem;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: rgba(255,255,255,0.9);
        backdrop-filter: blur(5px);
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.05);
    }
    .forgot-input:focus {
        outline: none;
        border-color: #0d9488;
        box-shadow: 0 0 0 3px rgba(13,148,136,0.1), inset 0 1px 3px rgba(0,0,0,0.05), 0 4px 12px rgba(13,148,136,0.15);
        background: rgba(255,255,255,1);
        transform: translateY(-1px);
    }
    .forgot-input::placeholder {
        color: #9ca3af;
        transition: color 0.3s ease;
    }
    .forgot-input:focus::placeholder {
        color: #d1d5db;
    }
    .forgot-btn {
        width: 100%;
        background: linear-gradient(135deg, #0d9488, #14b8a6, #06b6d4);
        color: white;
        padding: 1.1rem 2rem;
        border: none;
        border-radius: 14px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 6px 20px rgba(13,148,136,0.3), 0 2px 6px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1.2rem;
        position: relative;
        overflow: hidden;
    }
    .forgot-btn::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.6s ease;
    }
    .forgot-btn:hover {
        background: linear-gradient(135deg, #0f766e, #0d9488, #0891b2);
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(13,148,136,0.4), 0 4px 12px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .forgot-btn:hover::before {
        left: 100%;
    }
    .forgot-btn:active {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(13,148,136,0.3), 0 2px 6px rgba(0,0,0,0.1);
    }
    .forgot-link {
        color: #0d9488;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
    }
    .forgot-link:hover {
        color: #0f766e;
        text-decoration: underline;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
{% block body %}
<div class="forgot-dashboard">
  <div class="forgot-container">
    <div class="forgot-card">
      <h1><i class="fas fa-unlock-alt"></i> Forgot Password</h1>
      <p>Enter your email address below, and we'll send you a link to reset your password.</p>
      <form method="post" class="forgot-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="email" class="forgot-label"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" name="email" id="email" required class="forgot-input" placeholder="your@email.com">
        </div>
        <button type="submit" class="forgot-btn">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="{% url 'accounts:custom_login' %}" class="forgot-link">
          <i class="fas fa-sign-in-alt"></i> Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
